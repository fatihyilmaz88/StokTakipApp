<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>QR Etiketler</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:10px}
.bar{margin-bottom:10px}.bar button,.bar select{padding:8px 14px;font-size:15px}
.grid{display:flex;flex-wrap:wrap;gap:4mm}
.lbl{width:62mm;height:30mm;border:1px dashed #999;display:flex;align-items:center;gap:2mm;padding:2mm;box-sizing:border-box;overflow:hidden;page-break-inside:avoid}
.lbl svg{width:25mm;height:25mm;flex:none}
.lbl b{font-size:13pt;display:block;word-break:break-all}
.lbl span{font-size:8pt;display:block;line-height:1.2;max-height:3.6em;overflow:hidden}
.lbl i{font-size:7pt;color:#444;font-style:normal;display:block}
body.big .lbl{width:95mm;height:50mm}.body.big .lbl svg{width:42mm;height:42mm}
body.big .lbl svg{width:42mm;height:42mm}body.big .lbl b{font-size:20pt}body.big .lbl span{font-size:11pt}
@media print{.bar{display:none}.lbl{border:1px solid #ccc}body{padding:0}}
</style></head>
<body>
<div class="bar"><button onclick="print()">🖨 Yazdır</button>
<select onchange="document.body.className=this.value"><option value="">Küçük etiket (62×30 mm)</option><option value="big">Büyük etiket – raf (95×50 mm)</option></select>
<span>{{ labels|length }} etiket. Telefon kamerasıyla okutunca ilgili sayfa açılır.</span></div>
<div class="grid">
{% for l in labels %}
<div class="lbl">{{ l.qr }}<div><b>{{ l.title }}</b><span>{{ l.sub }}</span><i>{{ l.extra }}</i></div></div>
{% endfor %}
</div>
</body></html>
