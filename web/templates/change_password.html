{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Şifre Değiştir</h1>
  {% if g.user.must_change_pw %}<p class="flash warn">Devam etmeden önce şifrenizi değiştirmeniz gerekiyor.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Mevcut Şifre<input type="password" name="old" required></label>
    <label>Yeni Şifre (en az 6 karakter)<input type="password" name="new" minlength="6" required></label>
    <label>Yeni Şifre (tekrar)<input type="password" name="new2" minlength="6" required></label>
    <button class="btn primary full">Kaydet</button>
  </form>
</div>
{% endblock %}
