{% extends "base.html" %}
{% block content %}
<div class="card mid">
  <h1>{{ 'Tedarikçi Düzenle' if sid else 'Yeni Tedarikçi' }}</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Firma Adı *<input name="name" value="{{ s.name }}" required></label>
    <div class="grid2">
      <label>Yetkili Kişi<input name="contact" value="{{ s.contact }}"></label>
      <label>Telefon<input name="phone" type="tel" value="{{ s.phone }}"></label>
      <label>E-posta<input name="email" type="email" value="{{ s.email }}"></label>
      <label>Web Sitesi<input name="website" value="{{ s.website }}"></label>
      <label>Vergi Dairesi<input name="tax_office" value="{{ s.tax_office }}"></label>
      <label>Vergi No<input name="tax_no" value="{{ s.tax_no }}"></label>
    </div>
    <label>Adres<textarea name="address" rows="2">{{ s.address }}</textarea></label>
    <label>Not (ödeme vadesi, temsil ettiği markalar…)<textarea name="note" rows="2">{{ s.note }}</textarea></label>
    {% if sid %}<label class="chk"><input type="checkbox" name="active" value="1" {{ 'checked' if s.active }}> Aktif</label>{% endif %}
    <button class="btn primary full">Kaydet</button>
  </form>
</div>
{% endblock %}
